<svg xmlns="http://www.w3.org/2000/svg" width="240" height="240" viewBox="0 0 240 240" role="img" aria-label="Fraud detection logo">
  <defs>
    <linearGradient id="g1" x1="0" x2="1">
      <stop offset="0%" stop-color="#4f46e5"/>
      <stop offset="50%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <filter id="f1" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#0ea5a3" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- background rounded shield -->
  <rect x="12" y="12" width="216" height="216" rx="34" fill="url(#g1)" filter="url(#f1)"/>

  <!-- transaction arrows -->
  <g transform="translate(40,56)">
    <path d="M8 40 L88 40" stroke="#fff" stroke-width="8" stroke-linecap="round" fill="none" />
    <path d="M80 32 L88 40 L80 48" stroke="#fff" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" fill="none" />

    <path d="M88 64 L8 64" stroke="#fff" stroke-width="8" stroke-linecap="round" fill="none" />
    <path d="M16 56 L8 64 L16 72" stroke="#fff" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" fill="none" />
  </g>

  <!-- AI chip motif -->
  <g transform="translate(58,110)">
    <rect x="0" y="0" width="124" height="72" rx="10" fill="#fff" opacity="0.95"/>
    <rect x="12" y="12" width="100" height="48" rx="6" fill="url(#g1)"/>
    <circle cx="38" cy="36" r="6" fill="#fff"/>
    <rect x="60" y="28" width="36" height="16" rx="4" fill="#fff"/>
    <g stroke="#fff" stroke-width="3" stroke-linecap="round">
      <path d="M-6 36 L0 36" />
      <path d="M124 36 L130 36" />
    </g>
  </g>

  <!-- subtle outline -->
  <rect x="12" y="12" width="216" height="216" rx="34" fill="none" stroke="#ffffff" stroke-opacity="0.06" />
</svg>